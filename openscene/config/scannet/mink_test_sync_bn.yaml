DATA:
  data_root: data/scannet_3d
  data_root_2d_fused_feature: data/scannet_openseg_features
  feature_2d_extractor: openseg
  classes: 20
  aug: True
  voxel_size: 0.02
  input_color: False
  use_shm: False
  
DISTILL:
  arch_3d: MinkUNet18A
  ignore_label: 255
  train_gpu: [0, 1, 2]    # 3张GPU
  workers: 12             # 总worker数
  batch_size: 6           # 总batch_size=6，每GPU=2（较小，避免OOM）
  batch_size_val: 3       # 验证batch_size=3，每GPU=1
  sync_bn: True           # 🔑 启用同步BatchNorm
  multiprocessing_distributed: True
  dist_url: tcp://127.0.0.1:6788
  base_lr: 0.0001
  loss_type: cosine
  loop: 5
  epochs: 10              # 先测试10个epoch
  start_epoch: 0
  power: 0.9
  momentum: 0.9
  weight_decay: 0.01
  manual_seed: 1463
  print_freq: 10
  save_freq: 1
  save_path: out/scannet_mink_sync_bn_test
  resume:
  evaluate: True
  eval_freq: 1

TEST:
  split: val
  prompt_eng: True
  mark_no_feature_to_unknown: True
  feature_type: 'distill'
  save_feature_as_numpy: False
  vis_input: False
  vis_pred: False
  vis_gt: False
  test_workers: 8
  test_gpu: [0]
  test_batch_size: 1
  test_repeats: 5
  model_path:
  save_folder:

Distributed:
  dist_url: tcp://127.0.0.1:6788
  dist_backend: 'nccl'
  multiprocessing_distributed: True
  world_size: 1
  rank: 0 