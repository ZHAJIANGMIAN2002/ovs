# Inherit from a base config (we'll use settings from ours_lseg.yaml as a base)
# Note: OpenScene's config system doesn't have a formal inheritance syntax in YAML.
# We are conceptually inheriting by copying and modifying.

DATA:
  data_root: data/scannet_3d
  data_root_2d_fused_feature: data/scannet_openseg_features
  feature_2d_extractor: openseg
  classes: 20
  aug: True
  voxel_size: 0.05
  input_color: False # Set to True to use RGB features
  use_shm: False

DISTILL:
  # Key change: Specify the 3D architecture to be our PTV3 adapter
  arch_3d: PTV3Adapter
  # Add a new key to point to the PTV3 specific python config file
  ptv3_config: config/scannet/ptv3.py
  
  ignore_label: 255
  train_gpu: [0, 1, 2]  # 使用4张GPU进行并行训练
  workers: 12  # 每GPU 4个worker，总共16个
  batch_size: 3  # 总batch_size=4，每GPU实际batch_size=1
  batch_size_val: 3  # 验证batch_size=4，每GPU实际batch_size=1
  sync_bn: True  # 启用同步BatchNorm
  multiprocessing_distributed: True
  dist_url: tcp://127.0.0.1:6788
  base_lr: 0.0001
  loss_type: cosine
  loop: 5
  epochs: 100
  start_epoch: 0
  power: 0.9
  momentum: 0.9
  weight_decay: 0.01 # From PTV3 config
  manual_seed: 1463
  print_freq: 10
  save_freq: 1
  save_path: out/scannet_ptv3_test # Specify a new output path
  resume:
  evaluate: True
  eval_freq: 1

  # Add optimizer and scheduler settings from PTV3's original config
  optimizer:
    type: "AdamW"
    lr: 0.006
    weight_decay: 0.05
  
  scheduler:
    type: "OneCycleLR"
    max_lr: [0.006, 0.0006]
    pct_start: 0.05
    anneal_strategy: "cos"
    div_factor: 10.0
    final_div_factor: 1000.0

  param_dicts:
    - keyword: "block"
      lr: 0.0006

TEST:
  split: val
  prompt_eng: True
  mark_no_feature_to_unknown: True
  feature_type: 'distill' # We are evaluating the distilled model
  save_feature_as_numpy: False
  vis_input: False
  vis_pred: False
  vis_gt: False
  test_workers: 8
  test_gpu: [0]
  test_batch_size: 1
  test_repeats: 5
  model_path: '/mnt/data2/jmzhou/openscene/scannet/model/model_best.pth.tar'
  save_folder:

Distributed:
  dist_url: tcp://127.0.0.1:6788 
  dist_backend: 'nccl'
  multiprocessing_distributed: True # Ensure this is true for DDP
  world_size: 1  # 单机多卡，world_size=1
  rank: 0  # 主进程rank=0 